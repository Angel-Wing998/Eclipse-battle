<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eclipse Battle</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --gold: #ffe8a3;
            --bright-gold: #fff4c2;
            --dark: #08080b;
            --panel: rgba(10, 8, 15, 0.92);
        }

        body {
            min-height: 100vh;
            color: var(--gold);
            background: var(--dark);
            font-family: Georgia, "Times New Roman", serif;
        }

        button {
            font: inherit;
        }

        /* Main image menu */

        #welcomeScreen {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 100vh;
            overflow: hidden;
            background: #05030a url("eclipse-menu.png") center / contain no-repeat;
        }

        /*
            These buttons are transparent hotspots over the words
            already shown in eclipse-menu.png.
        */

        .image-menu {
            position: relative;
            width: min(1100px, 100vw);
            aspect-ratio: 696 / 390;
        }

        .menu-button {
            position: absolute;
            left: 1.5%;
            width: 30%;
            height: 10%;
            border: 2px solid transparent;
            border-radius: 10px;
            color: transparent;
            background: transparent;
            cursor: pointer;
        }

        .menu-button:hover,
        .menu-button:focus-visible {
            background: rgba(255, 220, 150, 0.18);
            border-color: rgba(255, 230, 170, 0.85);
            box-shadow: 0 0 18px rgba(255, 220, 150, 0.6);
            outline: none;
        }

        .start-button {
            top: 38%;
        }

        .saves-button {
            top: 48%;
        }

        .cards-button {
            top: 58%;
        }

        .leaderboard-button {
            top: 68%;
        }

        /* Other screens */

        .game-screen {
            display: none;
            min-height: 100vh;
            padding: 30px;
            background:
                radial-gradient(circle at top, #30203a, transparent 45%),
                #08080b;
        }

        .game-screen.active {
            display: block;
        }

        .panel {
            width: min(1000px, 100%);
            min-height: calc(100vh - 60px);
            margin: auto;
            padding: clamp(24px, 5vw, 60px);
            background: var(--panel);
            border: 1px solid rgba(255, 232, 163, 0.55);
            box-shadow: 0 0 35px rgba(255, 210, 80, 0.16);
        }

        h1 {
            margin-bottom: 16px;
            color: var(--bright-gold);
            font-size: clamp(2.3rem, 6vw, 5rem);
            text-shadow: 0 0 18px #f5c85b;
        }

        h2 {
            margin: 20px 0 14px;
            color: white;
        }

        p {
            margin-bottom: 18px;
            color: #f8e8b1;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .action-button,
        .back-button {
            margin-top: 20px;
            padding: 12px 22px;
            color: #17100a;
            background: var(--gold);
            border: 0;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
        }

        .action-button:hover,
        .back-button:hover {
            background: white;
        }

        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Battle */

        .battle-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 30px;
        }

        .fighter {
            padding: 25px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 232, 163, 0.35);
            text-align: center;
        }

        .fighter-icon {
            margin-bottom: 12px;
            font-size: 5rem;
        }

        .health-bar {
            height: 18px;
            margin: 15px 0;
            overflow: hidden;
            background: #21161b;
            border: 1px solid #8b6731;
        }

        .health {
            width: 100%;
            height: 100%;
            background: #b52c3d;
            transition: width 0.3s;
        }

        #battleMessage {
            min-height: 30px;
            margin-top: 25px;
            color: var(--bright-gold);
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        /* Saves, cards, and leaderboard */

        .save-card,
        .collection-card,
        .leaderboard-row {
            margin: 15px 0;
            padding: 18px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 232, 163, 0.35);
            font-family: Arial, sans-serif;
        }

        .collection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .collection-card {
            text-align: center;
        }

        .card-icon {
            display: block;
            margin-bottom: 10px;
            font-size: 3rem;
        }

        .leaderboard-row {
            display: flex;
            justify-content: space-between;
            color: white;
        }

        @media (max-width: 700px) {
            #welcomeScreen {
                background-size: cover;
                background-position: center;
            }

            .image-menu {
                width: 100vw;
            }

            .menu-button {
                left: 1%;
                width: 38%;
            }

            .battle-area {
                grid-template-columns: 1fr;
            }

            .game-screen {
                padding: 15px;
            }

            .panel {
                min-height: calc(100vh - 30px);
                padding: 25px 18px;
            }
        }
    </style>
</head>

            <button class="menu-button start-button" data-screen="startScreen" aria-label="Start game">
                Start game
            </button>

            <button class="menu-button saves-button" data-screen="savesScreen" aria-label="Open saves">
                Saves
            </button>

            <button class="menu-button cards-button" data-screen="collectionsScreen" aria-label="Open card collections">
                Card Collections
            </button>

            <button class="menu-button leaderboard-button" data-screen="leaderboardsScreen" aria-label="Open leaderboards">
                Leaderboards
            </button>
        </div>
    </main>
