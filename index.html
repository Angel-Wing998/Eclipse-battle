<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Eclipse Battle - Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top right, #6d28d9 0%, transparent 35%),
                linear-gradient(135deg, #16002f, #3b0764, #24004d);
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 80px;
            padding: 50px 10%;
        }

        .signup-container {
            width: 100%;
            max-width: 390px;
            padding: 35px;
            background: rgba(20, 0, 45, 0.85);
            border: 1px solid rgba(216, 180, 254, 0.5);
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.35);
        }

        .logo {
            margin-bottom: 10px;
            color: #f3e8ff;
            font-size: 32px;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 30px;
            color: #d8b4fe;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #e9d5ff;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #7e22ce;
            border-radius: 9px;
            outline: none;
            font-size: 15px;
        }

        input::placeholder {
            color: #c4b5fd;
        }

        input:focus {
            border-color: #d8b4fe;
            box-shadow: 0 0 8px rgba(216, 180, 254, 0.5);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            color: white;
            background: #9333ea;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #a855f7;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #message {
            min-height: 24px;
            margin-top: 20px;
            color: #d8b4fe;
            text-align: center;
        }

        .character-section {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .character {
            font-size: 190px;
            filter: drop-shadow(0 0 25px #c084fc);
            animation: float 3s ease-in-out infinite;
        }

        .character-section h2 {
            margin-top: 15px;
            color: #f3e8ff;
            font-size: 26px;
        }

        .character-section p {
            margin-top: 10px;
            color: #d8b4fe;
            font-size: 16px;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-16px);
            }
        }

        @media (max-width: 800px) {
            .page {
                flex-direction: column;
                justify-content: center;
                gap: 50px;
                padding: 35px 20px;
            }

            .signup-container {
                max-width: 400px;
            }

            .character {
                font-size: 130px;
            }

            .character-section h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <section class="signup-container">
            <h1 class="logo">⚔️ Eclipse Battle</h1>

            <p class="subtitle">Create your warrior account</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="username">Username</label>

                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Choose a username"
                        minlength="3"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Choose a password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit">Create Account</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="character-section">
            <div>
                <div class="character">🧙‍♂️</div>

                <h2>The Shadow Guardian</h2>

                <p>Your battle begins here.</p>
            </div>
        </section>

    </main>

    <script>
        const signupForm = document.getElementById("signupForm");
        const message = document.getElementById("message");

        signupForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (username.length < 3) {
                message.textContent =
                    "Username must be at least 3 characters long.";
                return;
            }

            if (password.length < 8) {
                message.textContent =
                    "Password must be at least 8 characters long.";
                return;
            }

            message.textContent =
                `Welcome, ${username}! Your account form was submitted.`;

            signupForm.reset();

            /*
                This is only a front-end demonstration.

                In a real application, send the data securely to a
                backend or authentication service. Never store passwords
                directly in browser code or localStorage.

                Example:

                fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password
                    })
                });
            */
        });
    </script>
</body>
</html>
