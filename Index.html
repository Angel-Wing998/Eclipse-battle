<!DOCTYPE html>
<html>
<head>
    <title>Eclipse Battle</title>
</head>

<body>

    <h1>⚔️ Eclipse Battle</h1>

    <h2>Enter your name</h2>

    <input id="playerName" type="text" placeholder="Your name">

    <button onclick="startGame()">Begin Battle</button>

    <p id="welcome"></p>

    <script>
        function startGame() {
            let name = document.getElementById("playerName").value;

            document.getElementById("welcome").textContent =
                "Welcome, " + name + "! A Shadow Beast approaches... 👹";
        }
    </script>

</body>
</html>
